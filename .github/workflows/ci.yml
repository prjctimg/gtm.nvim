name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.4

      - name: Syntax check
        run: |
          # `luac` is not on the runner, and Neovim is: it is the same Lua the
          # plugin runs on, so it parses the files the way they will be loaded.
          for f in $(find lua plugin scripts -name '*.lua'); do
            nvim --headless -c "lua local f,e=loadfile('$f') if not f then print(e) vim.cmd('cq') end" -c qa \
              || { echo "syntax error in $f"; exit 1; }
          done

      - name: Cross-module reference check
        run: nvim --headless -l scripts/checkrefs.lua

      - name: Headless smoke test
        run: nvim --headless -l scripts/smoke.lua

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: lunarmodules/luacheck@v1